<!DOCTYPE html>
<html class="dark" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Document Hub | Enterprise RAG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>

<body class="bg-background-dark font-display text-white overflow-hidden h-screen flex flex-col">
  <nav-component></nav-component>
  <div class="p-8">
    <h1 class="text-3xl font-bold mb-4">Document Hub</h1>
    <p class="text-white/60">Upload and manage your knowledge base documents.</p>
    <!-- Placeholder content -->
    <div id="drop-zone"
      class="mt-8 p-12 border-2 border-dashed border-white/10 rounded-2xl flex flex-col items-center justify-center text-center hover:border-accent-pink/50 hover:bg-white/5 transition-all cursor-pointer">
      <input type="file" id="file-input" class="hidden" multiple accept=".pdf,.txt,.docx,.md" />
      <span
        class="material-symbols-outlined text-6xl text-white/20 mb-4 group-hover:text-accent-pink/70 transition-colors">upload_file</span>
      <p class="text-xl font-semibold">Click to upload or drag and drop</p>
      <p class="text-sm text-white/40 mt-2">PDF, DOCX, TXT, MD supported</p>
    </div>
    <div id="upload-status" class="mt-4 hidden">
      <!-- Status messages will appear here -->
    </div>

    <!-- Uploaded Files Section -->
    <div class="mt-8">
      <h2 class="text-xl font-semibold mb-4">Uploaded Documents</h2>
      <div id="uploaded-files" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Files will be populated here -->
      </div>
    </div>
  </div>

  <script type="module" src="/src/api/client.js"></script>
  <script type="module" src="/src/components/navigation.js"></script>
  <script type="module">
    import { API } from '/src/api/client.js';

    document.addEventListener('DOMContentLoaded', () => {
      const nav = document.querySelector('nav-component');
      if (nav) nav.setActivePage('documents');

      // Upload Logic
      const dropZone = document.getElementById('drop-zone');
      const fileInput = document.getElementById('file-input');

      // Click to upload
      dropZone.addEventListener('click', () => {
        fileInput.click();
      });

      // Handle file selection
      fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
          handleFiles(e.target.files);
        }
      });

      // Drag and drop events
      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, preventDefaults, false);
      });

      function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
      }

      ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, highlight, false);
      });

      ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, unhighlight, false);
      });

      function highlight(e) {
        dropZone.classList.add('border-accent-pink', 'bg-accent-pink/10');
      }

      function unhighlight(e) {
        dropZone.classList.remove('border-accent-pink', 'bg-accent-pink/10');
      }

      dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        handleFiles(files);
      });

      function handleFiles(files) {
        const statusDiv = document.getElementById('upload-status');
        statusDiv.classList.remove('hidden');
        statusDiv.innerHTML = `<div class="p-4 bg-blue-500/20 text-blue-200 rounded-lg">Processing ${files.length} file(s)...</div>`;

        Array.from(files).forEach(async file => {
          try {
            // Call the actual upload API
            console.log(`Uploading ${file.name}...`);
            await API.uploadFile(file);

            statusDiv.innerHTML = `<div class="p-4 bg-green-500/20 text-green-200 rounded-lg flex items-center gap-2"><span class="material-symbols-outlined">check_circle</span> Upload complete: ${file.name}</div>`;
            
            // Refresh file list after upload
            loadUploadedFiles();
          } catch (error) {
            console.error(error);
            statusDiv.innerHTML = `<div class="p-4 bg-red-500/20 text-red-200 rounded-lg">Error uploading ${file.name}</div>`;
          }
        });
      }

      // Load uploaded files
      async function loadUploadedFiles() {
        try {
          const auditData = await API.getAuditTrail();
          const filesDiv = document.getElementById('uploaded-files');
          
          if (!auditData || auditData.length === 0) {
            filesDiv.innerHTML = '<p class="text-white/40">No documents uploaded yet.</p>';
            return;
          }

          // Group by file and show latest version
          const fileMap = {};
          auditData.forEach(entry => {
            const fileName = entry.file_path ? entry.file_path.split('/').pop() : 'Unknown';
            if (!fileMap[fileName] || entry.version > fileMap[fileName].version) {
              fileMap[fileName] = entry;
            }
          });

          const filesHTML = Object.values(fileMap).map(file => {
            const fileName = file.file_path ? file.file_path.split('/').pop() : 'Unknown';
            const dateStr = file.timestamp || file.uploaded_at || new Date();
            
            // Debug logging
            console.log('Processing file entry:', file);
            
            return `
            <div class="glass-panel rounded-xl p-4 border border-white/10 hover:border-white/20 transition-all">
              <div class="flex items-start justify-between">
                <div class="flex-1">
                  <h3 class="font-medium text-white truncate" title="${fileName}">${fileName}</h3>
                  <p class="text-sm text-white/60 mt-1">
                    Version ${file.version || 1} • ${new Date(dateStr).toLocaleDateString()}
                  </p>
                  <p class="text-xs text-white/40 mt-1">
                    Author: ${file.author || 'Unknown'} • Hash: ${file.hash ? file.hash.substring(0, 8) + '...' : 'N/A'}
                  </p>
                </div>
                <div class="flex gap-2">
                  <span class="material-symbols-outlined text-green-400">check_circle</span>
                  <button onclick="deleteDocument('${file.file_path}', '${file.hash}')" class="material-symbols-outlined text-red-400 hover:text-red-300 cursor-pointer">delete</button>
                </div>
              </div>
            </div>
          `;
          }).join('');

          // Add delete function
          window.deleteDocument = async function(filePath, hash) {
            if (!confirm('¿Estás seguro de que quieres eliminar este documento?')) return;
            
            try {
              const response = await fetch('/api/delete-document', {
                method: 'DELETE',
                headers: {
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({ file_path: filePath, hash: hash })
              });
              
              if (response.ok) {
                // Refresh the file list
                loadUploadedFiles();
                // Update status
                const statusDiv = document.getElementById('upload-status');
                statusDiv.classList.remove('hidden');
                statusDiv.innerHTML = `<div class="p-4 bg-green-500/20 text-green-200 rounded-lg flex items-center gap-2"><span class="material-symbols-outlined">delete</span> Documento eliminado correctamente</div>`;
              } else {
                throw new Error('Failed to delete document');
              }
            } catch (error) {
              console.error('Error deleting document:', error);
              const statusDiv = document.getElementById('upload-status');
              statusDiv.classList.remove('hidden');
              statusDiv.innerHTML = `<div class="p-4 bg-red-500/20 text-red-200 rounded-lg">Error al eliminar documento</div>`;
            }
          };

          filesDiv.innerHTML = filesHTML;
        } catch (error) {
          console.error('Failed to load uploaded files:', error);
          document.getElementById('uploaded-files').innerHTML = '<p class="text-white/40">Failed to load files.</p>';
        }
      }

      // Load files on page load
      loadUploadedFiles();
      // Refresh files every 30 seconds
      setInterval(loadUploadedFiles, 30000);
    });
  </script>
</body>

</html>
