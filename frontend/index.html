<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Enterprise RAG Dashboard</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  
  <!-- Space Grotesk Font -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body class="bg-background-dark font-display text-white overflow-hidden h-screen flex flex-col">
  
  <!-- Navigation Component -->
  <nav-component></nav-component>
  
  <!-- Main Dashboard Content -->
  <dashboard-component></dashboard-component>
  
  <!-- Scripts -->
  <script type="module" src="/src/api/client.js"></script>
  <script type="module" src="/src/components/navigation.js"></script>
  <script type="module" src="/src/components/dashboard.js"></script>
  
  <!-- Initialize Dashboard -->
  <script>
    // Initialize dashboard once components are loaded
    document.addEventListener('DOMContentLoaded', () => {
      console.log('Dashboard initialized');
      
      // Set active navigation state
      const nav = document.querySelector('nav-component');
      if (nav) nav.setActivePage('dashboard');
    });
  </script>
</body>
</html>
