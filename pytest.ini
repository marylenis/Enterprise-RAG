[tool:pytest]
# Test discovery and configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10

# Custom markers
markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    unit: marks tests as unit tests (deselect with '-m "not unit"')
    slow: marks tests as slow running (deselect with '-m "not slow"')
    docker: marks tests that require docker
    database: marks tests that require database connections
    api: marks tests that test API endpoints
    e2e: marks end-to-end workflow tests

# Minimum version
minversion = 6.0

# Test execution timeout
timeout = 300
timeout_method = thread

# Parallel execution (if pytest-xdist is installed)
# -n auto  # Run tests in parallel

# Coverage configuration (if pytest-cov is installed)
# --cov=src
# --cov-report=html
# --cov-report=term-missing
# --cov-fail-under=80

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Console output settings
console_output_style = progress

# JUnit XML for CI/CD integration
# --junit-xml=test-results.xml

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:llama_index.*
    ignore::UserWarning:transformers.*