version: '3.8'

services:
  # Base de datos vectorial
  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterprise-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag-network

  # Aplicación RAG
  app:
    build: .
    container_name: enterprise-rag-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./data:/app/data
    depends_on:
      - qdrant
    networks:
      - rag-network

volumes:
  qdrant_data:


networks:
  rag-network:
    driver: bridge
