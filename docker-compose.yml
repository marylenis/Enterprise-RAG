version: '3.8'

services:
  # Base de datos vectorial
  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterprise-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag-network

  # Aplicación RAG
  app:
    build: .
    container_name: enterprise-rag-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./data:/app/data
    depends_on:
      - qdrant
      - falkordb
    command: python src/main.py
    networks:
      - rag-network

  # Base de datos de grafos
  falkordb:
    image: falkordb/falkordb:latest
    container_name: enterprise-rag-falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    networks:
      - rag-network

volumes:
  qdrant_data:
  falkordb_data:


networks:
  rag-network:
    driver: bridge
